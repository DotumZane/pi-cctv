<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi CCTV</title>
<style>body{font:16px system-ui;margin:2rem;background:#f5f7fa;color:#17202a}main{max-width:1100px;margin:auto}.card{background:white;border-radius:10px;padding:1rem;margin:1rem 0;box-shadow:0 1px 4px #ccd}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.55rem;border-bottom:1px solid #eee}.online{color:#087f23}.offline{color:#b42318}button{padding:.45rem .8rem;cursor:pointer}select{padding:.4rem;margin:.2rem}.assignment{border:1px solid #dde3e8;border-radius:8px;padding:.7rem;margin:.6rem 0}</style></head>
<body><main><h1>Pi CCTV V1</h1><p>Central device and monitor routing dashboard.</p><section class="card"><label>Admin token <input id="token" type="password" placeholder="optional"></label> <button onclick="saveToken()">Save</button></section><section class="card"><h2>Devices</h2><table><thead><tr><th>Name</th><th>Type</th><th>Location</th><th>Status</th><th>Last seen</th></tr></thead><tbody id="devices"><tr><td colspan="5">Loading…</td></tr></tbody></table></section><section class="card"><h2>Monitor assignments</h2><div id="assignments">Loading…</div></section></main>
<script>
const api=(url,options={})=>{options.headers={...(options.headers||{}),...(localStorage.cctvToken?{Authorization:`Bearer ${localStorage.cctvToken}`}:{})};return fetch(url,options)};
function saveToken(){localStorage.cctvToken=document.querySelector('#token').value;load();}
function cameraSelect(cams,index,value=''){return `<select data-slot="${index}"><option value="">${index+1}: no camera</option>${cams.map(c=>`<option value="${c.id}" ${c.id===value?'selected':''}>${index+1}: ${c.name}</option>`).join('')}</select>`}
function monitorCard(m,cams,assignment){let cameras=[];try{cameras=JSON.parse(assignment?.cameras||'[]')}catch(e){}const layout=assignment?.layout||'single';return `<div class="assignment"><strong>${m.name}</strong> <select data-layout="${m.id}"><option value="single" ${layout==='single'?'selected':''}>Single</option><option value="2x2" ${layout==='2x2'?'selected':''}>2×2</option></select><div>${[0,1,2,3].map(i=>cameraSelect(cams,i,cameras[i]||'')).join('')}</div><button onclick="assign('${m.id}')">Apply routing</button> <small>Updated: ${assignment?.updated_at||'never'}</small></div>`}
async function load(){const devices=(await (await api('/api/devices')).json()).devices;document.querySelector('#devices').innerHTML=devices.map(d=>`<tr><td>${d.name}<br><small>${d.id}</small></td><td>${d.kind}</td><td>${d.location||'—'}</td><td class="${d.status}">${d.status}</td><td>${d.last_seen||'—'}</td></tr>`).join('')||'<tr><td colspan="5">No devices enrolled</td></tr>';const cams=devices.filter(d=>d.kind==='camera');const monitors=devices.filter(d=>d.kind==='monitor');const assignments=(await (await api('/api/assignments')).json()).assignments;const byMonitor=Object.fromEntries(assignments.map(a=>[a.monitor_id,a]));document.querySelector('#assignments').innerHTML=monitors.map(m=>monitorCard(m,cams,byMonitor[m.id])).join('')||'No monitors enrolled';}
async function assign(id){const card=document.querySelector(`[data-layout="${id}"]`).parentElement;const layout=card.querySelector(`[data-layout="${id}"]`).value;const cameras=[...card.querySelectorAll('[data-slot]')].map(s=>s.value).filter(Boolean).slice(0,layout==='single'?1:4);if(!cameras.length){alert('Select at least one camera');return}const r=await api(`/api/monitors/${id}/assignment`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({layout,cameras})});alert(r.ok?'Assignment saved':'Assignment failed');if(r.ok)load();}document.querySelector('#token').value=localStorage.cctvToken||'';load();setInterval(load,5000);
</script></body></html>
