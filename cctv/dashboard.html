<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi CCTV</title>
<style>body{font:16px system-ui;margin:2rem;background:#f5f7fa;color:#17202a}main{max-width:1100px;margin:auto}.card{background:white;border-radius:10px;padding:1rem;margin:1rem 0;box-shadow:0 1px 4px #ccd}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.55rem;border-bottom:1px solid #eee}.online{color:#087f23}.offline{color:#b42318}button{padding:.45rem .8rem;cursor:pointer}select{padding:.4rem}</style></head>
<body><main><h1>Pi CCTV V1</h1><p>Central device and monitor routing dashboard.</p><section class="card"><h2>Devices</h2><table><thead><tr><th>Name</th><th>Type</th><th>Location</th><th>Status</th><th>Last seen</th></tr></thead><tbody id="devices"><tr><td colspan="5">Loading…</td></tr></tbody></table></section><section class="card"><h2>Monitor assignments</h2><div id="assignments">Loading…</div></section></main>
<script>
async function load(){const devices=(await (await fetch('/api/devices')).json()).devices;document.querySelector('#devices').innerHTML=devices.map(d=>`<tr><td>${d.name}<br><small>${d.id}</small></td><td>${d.kind}</td><td>${d.location||'—'}</td><td class="${d.status}">${d.status}</td><td>${d.last_seen||'—'}</td></tr>`).join('')||'<tr><td colspan="5">No devices enrolled</td></tr>';const cams=devices.filter(d=>d.kind==='camera');const monitors=devices.filter(d=>d.kind==='monitor');document.querySelector('#assignments').innerHTML=monitors.map(m=>`<div><strong>${m.name}</strong> <select data-monitor="${m.id}"><option value="">Select camera</option>${cams.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select> <button onclick="assign('${m.id}')">Assign</button></div>`).join('')||'No monitors enrolled';}
async function assign(id){const select=document.querySelector(`[data-monitor="${id}"]`);if(!select.value)return;const r=await fetch(`/api/monitors/${id}/assignment`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({layout:'single',cameras:[select.value]})});alert(r.ok?'Assignment saved':'Assignment failed');}load();setInterval(load,5000);
</script></body></html>
