# V1 low-latency media relay configuration.
# Cameras publish and monitors read directly through this relay. The
# management server is not in the live-video path.
logLevel: warn
rtsp: true
rtspAddress: :8554
hls: true
hlsAddress: :8888
# HLS is encrypted for clients that connect directly to the relay.
hlsEncryption: true
hlsServerKey: /run/pi-cctv/tls/server.key
hlsServerCert: /run/pi-cctv/tls/server.crt
hlsVariant: mpegts
webrtc: true
webrtcAddress: :8889
# The dashboard opens this player over HTTP. WebRTC media uses DTLS/SRTP;
# only the player and signaling endpoint use HTTP.
webrtcEncryption: false
readTimeout: 5s
writeTimeout: 5s
writeQueueSize: 512
paths:
  all:
    source: publisher
