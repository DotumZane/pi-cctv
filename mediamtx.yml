# V1 low-latency media relay configuration.
# Cameras publish and monitors read directly through this relay. The
# management server is not in the live-video path.
logLevel: warn
rtsp: true
rtspAddress: :8554
hls: true
hlsAddress: :8888
# Safari is used from the HTTPS dashboard. Encrypt HLS and WebRTC so browsers
# do not block the live stream as mixed active content.
hlsEncryption: true
hlsServerKey: /run/pi-cctv/tls/server.key
hlsServerCert: /run/pi-cctv/tls/server.crt
hlsVariant: mpegts
webrtc: true
webrtcAddress: :8889
webrtcEncryption: true
webrtcServerKey: /run/pi-cctv/tls/server.key
webrtcServerCert: /run/pi-cctv/tls/server.crt
readTimeout: 5s
writeTimeout: 5s
writeQueueSize: 512
paths:
  all:
    source: publisher
