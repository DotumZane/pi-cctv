# V1 low-latency media relay configuration.
# Cameras publish and monitors read directly through this relay. The
# management server is not in the live-video path.
logLevel: warn
rtsp: true
rtspAddress: :8554
hls: true
hlsAddress: :8888
# Safari is used from an HTTP dashboard. Use the broadly compatible HLS
# transport; Low-Latency HLS on Apple devices requires HTTPS.
hlsVariant: mpegts
webrtc: true
webrtcAddress: :8889
readTimeout: 5s
writeTimeout: 5s
writeQueueSize: 512
paths:
  all:
    source: publisher
