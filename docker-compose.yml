services:
  management:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CCTV_ADMIN_TOKEN: ${CCTV_ADMIN_TOKEN:?set CCTV_ADMIN_TOKEN in .env}
    volumes:
      - cctv-data:/data
    depends_on:
      - media

  media:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

volumes:
  cctv-data:
