# Pi CCTV time server: the Pis on the CCTV network take their time from the
# dashboard server, so recordings, logs and burned-in camera timestamps agree
# without the Pis needing internet access.
pool pool.ntp.org iburst maxsources 4
# Keep serving the server's clock when internet time is unreachable.
local stratum 10 orphan
# Private LANs, Docker networks and Tailscale only.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
allow 100.64.0.0/10
allow fc00::/7
allow fe80::/10
# The time service has no remote control interface.
cmdport 0
