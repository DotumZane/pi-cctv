# Pi CCTV package cache: the dashboard server downloads each Debian and
# Raspberry Pi OS package once and serves it to the Pis on the CCTV network,
# so the Pis need no internet access for OS updates.
Port: 3142
CacheDir: /var/cache/apt-cacher-ng
LogDir: /var/log/apt-cacher-ng
# Remove cached packages that no repository index references for 4 days.
ExThreshold: 4
# Let HTTPS package sources through unchanged (not cached) for the known
# Debian and Raspberry Pi repositories only.
PassThroughPattern: ^(deb\.debian\.org|security\.debian\.org|archive\.raspberrypi\.(com|org)):443$
