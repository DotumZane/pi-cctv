[project]
name = "pi-cctv"
version = "0.1.126"
description = "Low-latency, centrally managed Raspberry Pi CCTV system"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cctv-server = "cctv.server:main"
cctv-agent = "cctv.agent:main"
cctv-media = "cctv.media:main"
cctv-record = "cctv.recording:main"
cctv-latency = "cctv.latency:main"
cctv-simulate = "cctv.simulate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
